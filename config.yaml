# ============================================================
#  WEEX Trading Bot — Configuration
# ============================================================

exchange:
  api_key:     "YOUR_API_KEY"
  api_secret:  "YOUR_SECRET_KEY"
  passphrase:  "YOUR_PASSPHRASE"
  base_url:    "https://api-spot.weex.com"   # Spot API base URL (contract API auto-routes to api-contract.weex.com)

# ── Set paper_trading: true while testing. Change to false for live. ──
trading:
  paper_trading: true

  pairs:
    - symbol:     "BTCUSDT_UMCBL"
      name:       "BTC"
      enabled:    true
      allocation: 0.34

    - symbol:     "ETHUSDT_UMCBL"
      name:       "ETH"
      enabled:    true
      allocation: 0.33

    - symbol:     "SOLUSDT_UMCBL"
      name:       "SOL"
      enabled:    true
      allocation: 0.33

  timeframe:              "5"    # Signal candle granularity (minutes) — switched to 5m+4h strategies
  lookback_candles:       300    # Candles fetched per request
  loop_interval_s:        900    # Full tick interval — model retrain / summary (15 min)
  entry_scan_interval_s:  300    # Entry-only scan when flat — checks every 5 min
  monitor_interval_s:     60     # SL/TP price check — gap protection (1 min)
  ltf_reversal_tf:        "5"    # Lower TF for reversal exit signal (5m when trading 15m)

risk:
  # Paper account = £100 equivalent in USDT
  initial_capital:      100.0

  # ── HWM ratchet: risk is % of high-water mark, sized by day of week ─────────
  # Position size = HWM × day_risk_pct[day]. HWM only advances on new equity highs.
  # During drawdowns we keep sizing at peak — the shovel doesn't shrink.
  # 0=Mon 1=Tue 2=Wed 3=Thu 4=Fri 5=Sat 6=Sun
  day_risk_pct:
    0: 0.05    # Monday    — 5%
    1: 0.025   # Tuesday   — 2.5% (weakest day)
    2: 0.05    # Wednesday — 5%
    3: 0.07    # Thursday  — 7% (53-83% WR across all strategies)
    4: 0.05    # Friday    — 5%
    5: 0.025   # Saturday  — 2.5% (5m strategies weak on Sat across all three)
    6: 0.025   # Sunday    — 2.5% (weakest day)

  stop_loss_atr_mult:   2.2      # MAE-calibrated from 2221 simulated trades (was 1.5 — too tight)
  take_profit_atr_mult: 3.5      # MAE-calibrated from 2221 simulated trades (was 3.0)
  min_rr_ratio:         1.5      # Reject any trade where actual R/R falls below 1.5
  max_open_positions:   5        # Tier 1 strategies only — reduces correlated crash exposure
  max_daily_loss_pct:   0.10     # 10% of current equity — tighter cap for real money protection

  # ── TF-stratified slot tiers ───────────────────────────────────────────────
  # Each symbol gets one position per tier at a time.
  # A 1h trade on BTC no longer blocks a 15m signal on BTC.
  # Tier A (short): 5m, 15m timeframes
  # Tier B (long):  1h, 4h, 1d timeframes
  tf_tiers:
    short: ["5m", "15m"]
    long:  ["1h", "4h", "1d"]
  max_leverage:         20       # Hard cap — leverage will never exceed this

  # ── Multi-TP partial exit ──────────────────────────────────────────────────
  # TP1: close half the position at 1:1 R/R, then move stop to breakeven.
  # The remaining half rides until the final TP or an LTF reversal signal.
  take_profit_1_atr_mult: 1.5    # TP1 at same distance as SL  →  1 : 1 R/R
  take_profit_1_close_pct: 0.50  # Close 50 % of position at TP1

strategy:
  # ── Signal thresholds ──────────────────────────────────────────────────────
  # Early-stage values — model has limited data so probabilities cluster near 0.33.
  # Raise buy_threshold toward 0.55–0.60 once the bot has 50+ completed trades.
  buy_threshold:    0.55   # Matches the backtest min_confidence threshold exactly
  sell_threshold:   0.55   # Matches the backtest min_confidence threshold exactly

  # ── Trade quality gates (BOTH must pass before entering a trade) ───────────
  min_ev:           0.001  # Minimum Expected Value (EV > 0.1 % per trade)
  min_win_rate:     0.45   # Need at least 45 % historical win rate before trading
  min_ev_trades:    10     # Minimum trades before EV gate is enforced
  min_strategy_accuracy: 0.52  # Min CV accuracy for a (symbol, TF) strategy to be traded

  # Strategies proven unprofitable or weak in backtest — blocked regardless of cv_accuracy.
  # Format: "{SYMBOL}_{TF}"  e.g. "BTCUSDT_UMCBL_4h"
  blocked_slots:
    # ── Single-TF (always blocked) ─────────────────────────────────────────────
    - "BTCUSDT_UMCBL_4h"       # EV +0.098% but only +4.5% over 2yr, MaxDD -33%
    - "BTCUSDT_UMCBL_1d"       # EV -6.19%, PnL -49.5%
    - "ETHUSDT_UMCBL_4h"       # EV -0.443%, PnL -19.5%
    - "ETHUSDT_UMCBL_1d"       # EV -11.72%, PnL -35.2%
    - "SOLUSDT_UMCBL_4h"       # EV -1.37%, PnL -50.8%
    - "SOLUSDT_UMCBL_1d"       # EV -6.19%, PnL -31.0%
    # ── Weak 1h confluence strategies ─────────────────────────────────────────
    - "SOLUSDT_UMCBL_1h+4h"    # MaxDD -18.6%, 45.1% WR, terrible Tue/Wed — replaced by SOL 1h+1d
    - "ETHUSDT_UMCBL_1h+4h"    # Weak monthly consistency — replaced by ETH 1h+1d
    - "BTCUSDT_UMCBL_1h+4h"    # 45.6% WR, MaxDD -25.7%, weak Mon/Tue
    # ── Weak 15m confluence strategies ────────────────────────────────────────
    - "SOLUSDT_UMCBL_15m+4h"   # 46.6% WR, MaxDD -14.8%, weak Mon/Fri
    - "SOLUSDT_UMCBL_15m+1h"   # 42.3% WR ❌, MaxDD -15.2%
    - "ETHUSDT_UMCBL_15m+1h"   # 44.2% WR, MaxDD -16.6%
    - "BTCUSDT_UMCBL_15m+1h"   # 44.9% WR, MaxDD -9.0% — marginal, dropped for cleaner slots
    # ── Single-TF 15m (blocked — 5m+4h is the active short-tier strategy) ───
    - "BTCUSDT_UMCBL_15m"      # single-TF blocked; use 5m+4h confluence instead
    - "ETHUSDT_UMCBL_15m"      # single-TF blocked
    - "SOLUSDT_UMCBL_15m"      # single-TF blocked
    # ── Replaced 15m short-tier strategies (swapped for 5m+4h) ──────────────
    - "BTCUSDT_UMCBL_15m+1d"   # replaced by BTC 5m+4h — same slot tier, faster turnover
    - "ETHUSDT_UMCBL_15m+1d"   # replaced by ETH 5m+4h
    - "SOLUSDT_UMCBL_15m+1d"   # replaced by SOL 5m+4h
    - "BTCUSDT_UMCBL_15m+4h"   # replaced by BTC 5m+4h
    - "ETHUSDT_UMCBL_15m+4h"   # replaced by ETH 5m+4h
    # ── 5m strategies not in use ──────────────────────────────────────────────
    - "SOLUSDT_UMCBL_5m+1h"    # 5m+4h preferred for SOL
    - "SOLUSDT_UMCBL_5m+1d"    # 5m+4h preferred for SOL
    - "BTCUSDT_UMCBL_5m+1h"    # 5m+4h preferred for BTC
    - "BTCUSDT_UMCBL_5m+1d"    # 5m+4h preferred for BTC
    - "ETHUSDT_UMCBL_5m+1h"    # 5m+4h preferred for ETH
    - "ETHUSDT_UMCBL_5m+1d"    # 5m+4h preferred for ETH

  # ── Time-of-day entry gates ───────────────────────────────────────────────
  # Block new entries during consistently weak UTC hours (across all strategies).
  # 03:00 — worst single hour, 8/12 strategies below 45% WR
  # 10:00 — surprisingly weak across most strategies
  # 21:00 — 9/12 strategies below 50% WR
  blocked_hours_utc: [2, 3, 6, 10, 21]   # added 02:00 (BTC/ETH weak) and 06:00 (all three weak on 5m)

  # ── Time-of-day risk multipliers ──────────────────────────────────────────
  # Applied on top of day_risk_pct. 12:00-15:00 UTC is the golden window.
  # 14:00 UTC is the single strongest hour across nearly every strategy.
  # Format: hour (UTC) → multiplier
  hour_risk_mult:
    1:  1.2   # 01:00 UTC — BTC 56%, ETH 64%, SOL 59% on 5m strategies
    12: 1.3   # London midday — strong across all strategies
    13: 1.3   # NY pre-open
    14: 1.5   # Single best hour overall
    15: 1.3   # NY open

  # ── Day-of-week slot blocks ────────────────────────────────────────────────
  # Slots listed here will not enter new trades on the specified days.
  # Days: 0=Mon 1=Tue 2=Wed 3=Thu 4=Fri 5=Sat 6=Sun
  day_blocks:
    1:  # Tuesday — block strategies with poor Tuesday edge
      - "BTCUSDT_UMCBL_1h+1d"   # 37.0% WR on Tuesdays
      - "ETHUSDT_UMCBL_1h+1d"   # 43.8% WR on Tuesdays
      - "SOLUSDT_UMCBL_1h+1d"   # 35.0% WR on Tuesdays
    6:  # Sunday — block strategies with poor Sunday edge
      - "SOLUSDT_UMCBL_1h+1d"   # 42.9% WR on Sundays
      - "ETHUSDT_UMCBL_1h+1d"   # 47.6% WR on Sundays

  # ── Monthly withdrawal rule ────────────────────────────────────────────────
  # At end of each month: withdraw 50% of net profit above starting capital floor.
  # Floor = initial_capital. Never withdraw below the floor.
  # Example: account at £620, floor £500 → profit £120 → withdraw £60, keep £60.
  # After withdrawal, HWM resets to new equity on next redeploy.
  withdrawal_floor:     500.0   # Never withdraw below this (update when going live)
  withdrawal_pct:       0.50    # Withdraw 50% of profit above floor each month

  # ── Thursday confidence boost ──────────────────────────────────────────────
  # On Thursdays, accept signals with lower model confidence (0.50 vs 0.55)
  # but require a stricter R/R (2.0 vs 1.5) to compensate.
  # Backtest shows Thu WR is 53-83% across all strategies — structural edge.
  thursday_buy_threshold:  0.50
  thursday_sell_threshold: 0.50
  thursday_min_rr:         1.5

  # ── Hold / exit rules ──────────────────────────────────────────────────────
  min_holding_candles: 2

  # ── Self-improvement schedule ──────────────────────────────────────────────
  # The bot retrains MORE FREQUENTLY early on to learn fast,
  # then gradually slows down as its data set matures.
  #   0–14 completed trades  →  retrain every 5
  #  15–39 completed trades  →  retrain every 10
  #  40–99 completed trades  →  retrain every 20
  # 100+   completed trades  →  retrain every 40
  retrain_stages:
    - {after_trades:   0, retrain_every:  5}
    - {after_trades:  15, retrain_every: 10}
    - {after_trades:  40, retrain_every: 20}
    - {after_trades: 100, retrain_every: 40}

  # ── Labelling ──────────────────────────────────────────────────────────────
  min_training_samples:  60    # Don't train until we have at least 60 labelled samples
  label_horizon_candles:  4    # Look 4 candles forward to label BUY / HOLD / SELL
  label_move_threshold: 0.015  # Fallback only — per-TF thresholds in strategy.py take priority
                               # (5m=0.3%, 15m=0.5%, 1h=0.8%, 4h=1.5%, 1d=2.0%)

logging:
  log_file:    "logs/bot.log"
  trades_file: "logs/trades.csv"
  models_dir:  "/data/models/"
  level:       "INFO"

# ── Data collection + analysis ──────────────────────────────────────────────
data:
  # Railway persistent volume mount path — set this up in Railway dashboard
  # (Volumes tab → Add Volume → mount at /data)
  data_dir:             "/data"

  # Higher-timeframe used for confluence filtering.
  # This is overridden automatically by the analysis if it finds a better one.
  confluence_timeframe: "60"    # 1h filter applied on top of 15m signals

  # Analysis results older than this many days trigger a fresh analysis run
  analysis_stale_days:  1     # force fresh analysis on next deploy — picks up 5m strategies. Set back to 9999 after first restart.

  # Signal timeframe bounds — analysis picks the best TF per symbol automatically.
  #
  # Why cap at 15m?
  # Longer TFs (4h, 1h) score higher CV accuracy in analysis, but their calibrated
  # models output probabilities of 0.13–0.16 — never enough to cross the 0.40 buy
  # threshold. Root cause: 4h yields only ~1,460 directional training samples over
  # 2 years vs ~23,000 for 15m. With too few samples the RandomForest can't form
  # confident predictions — calibration maps everything toward 0.33 (prior).
  #
  # 15m gives proven results: 48.7% BTC / 48.3% ETH win rate in backtest.
  # Revisit this cap after the bot has 50+ live trades and we can measure whether
  # a wider TF range produces better live performance.
  min_signal_tf_minutes: 5     # 5m enabled — 5m+4h strategies confirmed profitable in backtest
  max_signal_tf_minutes: 1440  # No cap — let analysis pick the best TF per symbol across 15m/1h/4h/1d
